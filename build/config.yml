# Wails v3 build configuration
version: '3'

info:
  companyName: "NFA Tool"
  productName: "NFA Tool Recode v2"
  productIdentifier: "com.nfatool.recode"
  description: "Steam ConnectCache token login for Windows"
  copyright: "© 2026 NFA Tool contributors"
  comments: "NFA Tool Recode v2 — production"
  version: "2.0.1"

dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend/node_modules
      - bin
      - .task
    file:
      - .DS_Store
      - user_backup.json
      - accounts.db
    watchedExtension:
      - "*.go"
      - "*.js"
      - "*.ts"
      - "*.svelte"
      - "*.css"
      - "*.html"
      - "*.json"
    gitCommands:
      - git ls-files
      - git ls-files --others --exclude-standard
  cmds:
    - wails3 task common:install:frontend:deps
    - wails3 task common:dev:frontend
